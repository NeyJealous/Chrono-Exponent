name: Godot Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Gameplay smoke test
        run: godot --headless --path . -s res://tests/smoke_test.gd

      - name: Save migration tests
        run: godot --headless --path . -s res://tests/save_migration_test.gd

      - name: Balance simulation
        run: godot --headless --path . -s res://tools/balance_simulator.gd

      - name: Boot main scene
        run: godot --headless --path . --quit-after 2
